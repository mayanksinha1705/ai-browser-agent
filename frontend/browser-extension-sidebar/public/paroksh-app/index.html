<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAROKSH - AI Browser Agent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- ============ HEADER ============ -->
    <header id="header">
      <div class="header-left">
        <svg class="icon-sparkles" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
          <path d="M20 3v4"/>
          <path d="M22 5h-4"/>
          <path d="M4 17v2"/>
          <path d="M5 18H3"/>
        </svg>
        <span class="header-title">PAROKSH</span>
      </div>

      <div class="header-right">
        <button id="btn-new-chat" class="icon-btn" title="New session">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>
        </button>

        <div class="settings-wrap">
          <button id="btn-settings" class="icon-btn" title="Settings">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>

          <div id="settings-menu" class="hidden">
            <button id="btn-reset-size" class="menu-item">Reset size</button>
            <button id="btn-maximize" class="menu-item">Maximize</button>
            <button id="btn-close" class="menu-item menu-item-danger">Close</button>
            <div class="menu-divider"></div>
            <div class="theme-row">
              <span>Theme</span>
              <button id="btn-theme" class="theme-btn" title="Toggle theme">
                <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- ============ MESSAGES (grow + scroll) ============ -->
    <main id="messages">
      <div id="empty-state">
        <h1 class="empty-title">Hello, <span class="hello-name">UDAY</span></h1>
      </div>
      <div id="messages-list" class="hidden"></div>
    </main>

    <!-- ============ COMPOSER (fixed bottom) ============ -->
    <footer id="composer">
      <form id="chat-form">
        <div class="input-box">
          <textarea id="chat-input" rows="1" placeholder="Type a message..."></textarea>
          <div class="input-actions">
            <div class="actions-left">
              <button type="button" id="btn-image" class="composer-btn" title="Upload photo">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
              </button>
              <input id="image-input" type="file" accept="image/*" hidden />
              <button type="button" id="btn-attach" class="composer-btn" title="Attach file">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              </button>
              <input id="file-input" type="file" hidden />
            </div>
            <div class="actions-right">
              <button type="button" id="btn-mic" class="composer-btn" title="Voice chat">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
              </button>
              <button type="submit" id="btn-send" disabled>
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
              </button>
            </div>
          </div>
        </div>
      </form>
    </footer>

    <!-- ============ VOICE AGENT OVERLAY (ChatGPT-style) ============ -->
    <div id="voice-overlay" class="hidden">
      <button id="btn-voice-close" class="voice-close" title="Exit voice mode">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>

      <div class="voice-center">
        <div class="orb" id="voice-orb">
          <div class="aura"></div>
          <div class="core"></div>
          <div class="ring"></div>
          <div class="particles">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <p id="voice-status" class="voice-status">Listening...</p>
        <p id="voice-transcript" class="voice-transcript"></p>
        <p id="voice-response" class="voice-response"></p>
      </div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
